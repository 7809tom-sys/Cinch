<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Detective Shopper investigation scene</title>
  <desc id="desc">A magnifying glass inspecting a shopping bag on a cool city dusk backdrop</desc>
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2A3A"/>
      <stop offset="55%" stop-color="#243B4F"/>
      <stop offset="100%" stop-color="#0E1822"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D7E6F2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7EB6D9" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F0B429" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#dusk)"/>
  <circle cx="1180" cy="220" r="220" fill="url(#glow)"/>

  <!-- distant windows -->
  <g opacity="0.35">
    <rect x="120" y="180" width="70" height="420" fill="#2E455A"/>
    <rect x="220" y="120" width="90" height="480" fill="#334D63"/>
    <rect x="340" y="210" width="60" height="390" fill="#2A4155"/>
    <rect x="140" y="220" width="14" height="18" fill="#F0B429"/>
    <rect x="170" y="260" width="14" height="18" fill="#9FD0EA"/>
    <rect x="250" y="170" width="14" height="18" fill="#F0B429"/>
    <rect x="280" y="210" width="14" height="18" fill="#9FD0EA"/>
    <rect x="250" y="280" width="14" height="18" fill="#F0B429"/>
  </g>

  <!-- shopping bag -->
  <g transform="translate(620 390)">
    <path d="M70 110 H330 L300 420 H100 Z" fill="#E8EEF3"/>
    <path d="M70 110 H330 L318 170 H82 Z" fill="#C9D6E2"/>
    <path d="M140 110 C140 40 260 40 260 110" stroke="#F0B429" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="270" r="42" fill="#1A2A3A"/>
    <path d="M200 240 V300 M175 270 H225" stroke="#F0B429" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(820 250)">
    <circle cx="160" cy="160" r="150" fill="url(#lens)" stroke="#D7E6F2" stroke-width="22"/>
    <circle cx="160" cy="160" r="118" stroke="#F0B429" stroke-width="4" opacity="0.7"/>
    <rect x="268" y="268" width="46" height="210" rx="23" transform="rotate(-42 268 268)" fill="#D7E6F2"/>
    <rect x="278" y="278" width="26" height="180" rx="13" transform="rotate(-42 278 278)" fill="#F0B429"/>
  </g>
</svg>
