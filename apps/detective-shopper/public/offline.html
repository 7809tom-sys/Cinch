<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Detective Shopper</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121c27;
        color: #e8eef3;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { color: #f0b429; font-size: 1.5rem; margin: 0 0 12px; }
      p { color: #9bb0c3; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #f0b429;
        color: #121c27;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 20px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        Detective Shopper can't reach the network right now. Your recently
        viewed scans and coupons are still cached — reconnect to pull fresh
        prices.
      </p>
      <a href="/scan">Try again</a>
    </div>
  </body>
</html>
