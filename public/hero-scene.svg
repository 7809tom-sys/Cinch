<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cinch Seed growing a live site</title>
  <desc id="desc">Warm studio light with a sprouting seed motif on the left and a glowing laptop workspace on the right</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F0E4"/>
      <stop offset="42%" stop-color="#E7F2EC"/>
      <stop offset="100%" stop-color="#0F3D35"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2C14B"/>
      <stop offset="100%" stop-color="#F6A623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A5C50"/>
      <stop offset="100%" stop-color="#163E36"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#FBFEFC"/>
      <stop offset="100%" stop-color="#D9F0E6"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D9B7A"/>
      <stop offset="100%" stop-color="#1F6B5C"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#3D9B7A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- warm sun bloom (right-back) -->
  <circle cx="1180" cy="210" r="220" fill="url(#sun)" opacity="0.85" filter="url(#soft)"/>
  <circle cx="1320" cy="120" r="90" fill="#FFE8A3" opacity="0.55" filter="url(#soft)"/>

  <!-- open left atmosphere — keeps text safe -->
  <ellipse cx="260" cy="320" rx="340" ry="260" fill="#FFF8EC" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="420" cy="480" rx="280" ry="180" fill="#D8EFE4" opacity="0.35" filter="url(#soft)"/>

  <!-- sprouting seed metaphor (left, behind copy zone but soft) -->
  <g transform="translate(120 520)" opacity="0.9">
    <ellipse cx="90" cy="210" rx="70" ry="22" fill="#1F6B5C" opacity="0.25"/>
    <path d="M90 200 C90 140 90 90 90 40" stroke="#1F6B5C" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 110 C40 70 10 40 18 18 C52 28 72 70 90 110 Z" fill="url(#leafA)"/>
    <path d="M90 120 C130 78 168 48 172 24 C140 38 118 78 90 120 Z" fill="url(#leafB)"/>
    <path d="M90 150 C108 118 128 98 150 84 C128 104 112 130 90 150 Z" fill="#56B08B"/>
    <ellipse cx="90" cy="208" rx="28" ry="18" fill="#C47A2C"/>
    <ellipse cx="90" cy="204" rx="18" ry="11" fill="#E8A54B"/>
  </g>

  <!-- floating growth marks -->
  <g opacity="0.35" fill="#1F6B5C">
    <circle cx="380" cy="220" r="5"/>
    <circle cx="430" cy="250" r="3"/>
    <circle cx="340" cy="280" r="4"/>
  </g>
  <g opacity="0.4" fill="#E8A54B">
    <circle cx="1480" cy="360" r="6"/>
    <circle cx="1510" cy="400" r="3"/>
  </g>

  <!-- desk surface — right weighted -->
  <path d="M520 680 C820 600 1120 590 1600 650 L1600 1000 L520 1000 Z" fill="url(#desk)"/>
  <path d="M520 680 C820 600 1120 590 1600 650" stroke="#F0B429" stroke-width="2" opacity="0.35"/>

  <!-- laptop — hard right so copy never sits on the screen -->
  <g transform="translate(860 300)">
    <rect x="36" y="18" width="560" height="360" rx="22" fill="#0B2420"/>
    <rect x="58" y="40" width="516" height="316" rx="10" fill="url(#screen)"/>

    <!-- lively UI: growth, not gray print -->
    <rect x="82" y="64" width="140" height="16" rx="8" fill="#1F6B5C"/>
    <text x="96" y="76" fill="#F7FBF9" font-size="11" font-family="ui-sans-serif, system-ui" font-weight="700">Cinch Seed</text>

    <rect x="82" y="100" width="200" height="10" rx="5" fill="#9CBEAE"/>
    <rect x="82" y="122" width="150" height="10" rx="5" fill="#C5DCD1"/>

    <!-- growth bars -->
    <g transform="translate(82 170)">
      <rect width="44" height="110" rx="8" fill="#D9EEE4"/>
      <rect y="50" width="44" height="60" rx="8" fill="#3D9B7A"/>
      <rect x="60" width="44" height="110" rx="8" fill="#D9EEE4"/>
      <rect x="60" y="28" width="44" height="82" rx="8" fill="#1F6B5C"/>
      <rect x="120" width="44" height="110" rx="8" fill="#D9EEE4"/>
      <rect x="120" y="12" width="44" height="98" rx="8" fill="#F0B429"/>
    </g>

    <!-- rising curve -->
    <path d="M300 280 C340 250 380 240 420 200 C460 160 500 150 540 120"
      stroke="#1F6B5C" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="540" cy="120" r="8" fill="#F0B429"/>
    <circle cx="540" cy="120" r="18" fill="#F0B429" opacity="0.22"/>

    <rect x="300" y="64" width="250" height="150" rx="14" fill="#EEF7F2"/>
    <rect x="320" y="88" width="120" height="12" rx="6" fill="#1F6B5C" opacity="0.75"/>
    <rect x="320" y="116" width="180" height="8" rx="4" fill="#A8C9BB"/>
    <rect x="320" y="136" width="160" height="8" rx="4" fill="#C5DCD1"/>
    <rect x="320" y="164" width="90" height="28" rx="8" fill="#F0B429"/>

    <rect x="36" y="378" width="560" height="24" rx="6" fill="#071A17"/>
    <rect x="-10" y="402" width="640" height="16" rx="5" fill="#04110E"/>
  </g>

  <!-- plant on far right for depth -->
  <g transform="translate(1480 560)">
    <ellipse cx="40" cy="160" rx="36" ry="12" fill="#0B2420" opacity="0.35"/>
    <rect x="26" y="100" width="28" height="55" rx="8" fill="#F0B429"/>
    <path d="M40 100 C18 70 4 48 10 30 C28 40 34 70 40 100 Z" fill="#3D9B7A"/>
    <path d="M40 100 C62 68 80 50 78 28 C58 40 50 70 40 100 Z" fill="#1F6B5C"/>
  </g>
</svg>
