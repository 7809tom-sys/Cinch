<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cinch workspace</title>
  <desc id="desc">A calm desk scene with an open notebook, laptop, and soft morning light</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8E4DA"/>
      <stop offset="45%" stop-color="#E7F3EE"/>
      <stop offset="100%" stop-color="#F4F8F5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7E8DF"/>
      <stop offset="100%" stop-color="#B7D3C6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FBFA"/>
      <stop offset="100%" stop-color="#E4F0EB"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="1280" cy="180" rx="280" ry="160" fill="#9FCFB8" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="320" cy="240" rx="220" ry="140" fill="#BFE0D1" opacity="0.45" filter="url(#soft)"/>

  <!-- window light -->
  <rect x="980" y="80" width="420" height="320" rx="18" fill="#F8FCF9" opacity="0.55"/>
  <rect x="1000" y="100" width="380" height="280" rx="10" fill="#D9EEE4" opacity="0.7"/>
  <path d="M1190 100 V380 M1000 240 H1380" stroke="#F7FBFA" stroke-width="10" opacity="0.55"/>

  <!-- desk surface -->
  <path d="M40 620 C420 540 980 540 1560 640 L1560 1000 L40 1000 Z" fill="url(#desk)"/>
  <path d="M40 620 C420 540 980 540 1560 640" stroke="#9CBEAE" stroke-width="3" opacity="0.5"/>

  <!-- laptop -->
  <g transform="translate(470 390)">
    <rect x="40" y="20" width="620" height="390" rx="24" fill="#1C3A33"/>
    <rect x="68" y="48" width="564" height="334" rx="12" fill="url(#screen)"/>
    <!-- UI chrome -->
    <rect x="96" y="76" width="160" height="18" rx="9" fill="#1F6B5C" opacity="0.85"/>
    <rect x="96" y="118" width="220" height="12" rx="6" fill="#9CBEAE"/>
    <rect x="96" y="148" width="180" height="12" rx="6" fill="#C5DCD1"/>
    <rect x="96" y="198" width="250" height="96" rx="14" fill="#D9EEE4"/>
    <rect x="368" y="76" width="236" height="250" rx="16" fill="#EEF7F2"/>
    <rect x="392" y="108" width="188" height="14" rx="7" fill="#1F6B5C" opacity="0.7"/>
    <rect x="392" y="140" width="160" height="10" rx="5" fill="#A8C9BB"/>
    <rect x="392" y="168" width="148" height="10" rx="5" fill="#C5DCD1"/>
    <rect x="392" y="210" width="188" height="72" rx="12" fill="#D3E9DF"/>
    <rect x="40" y="410" width="620" height="28" rx="8" fill="#152E29"/>
    <rect x="-20" y="438" width="700" height="18" rx="6" fill="#0F241F"/>
  </g>

  <!-- notebook -->
  <g transform="translate(180 620) rotate(-8)">
    <rect width="260" height="190" rx="10" fill="#F4F8F5"/>
    <rect x="18" width="14" height="190" fill="#1F6B5C"/>
    <path d="M52 48 H230 M52 78 H210 M52 108 H220 M52 138 H190" stroke="#9CBEAE" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- plant -->
  <g transform="translate(1220 560)">
    <ellipse cx="70" cy="180" rx="54" ry="18" fill="#8FB3A3" opacity="0.45"/>
    <rect x="48" y="110" width="44" height="70" rx="10" fill="#1F6B5C"/>
    <path d="M70 110 C40 70 18 50 28 34 C52 42 62 70 70 110 Z" fill="#3D9B7A"/>
    <path d="M70 110 C98 66 126 48 124 30 C98 40 84 72 70 110 Z" fill="#2F7F64"/>
    <path d="M70 110 C78 78 92 58 110 46 C92 62 82 86 70 110 Z" fill="#56B08B"/>
  </g>
</svg>
