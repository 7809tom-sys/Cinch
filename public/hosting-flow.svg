<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cinch hosting flow</title>
  <desc id="desc">Search a domain, host on a Cinch subdomain, point DNS, go live</desc>
  <rect width="720" height="420" fill="#F7FBF9"/>
  <rect x="32" y="48" width="180" height="120" rx="16" fill="#E8F3EE" stroke="#1F6B5C" stroke-width="2"/>
  <text x="122" y="100" text-anchor="middle" fill="#0F3D35" font-family="system-ui,sans-serif" font-size="18" font-weight="700">1. Search</text>
  <text x="122" y="128" text-anchor="middle" fill="#4D6560" font-family="system-ui,sans-serif" font-size="13">Cloudflare domains</text>
  <path d="M222 108 H268" stroke="#3D9B7A" stroke-width="3" stroke-linecap="round"/>
  <path d="M256 98 L272 108 L256 118" fill="#3D9B7A"/>
  <rect x="272" y="48" width="180" height="120" rx="16" fill="#E8F3EE" stroke="#1F6B5C" stroke-width="2"/>
  <text x="362" y="100" text-anchor="middle" fill="#0F3D35" font-family="system-ui,sans-serif" font-size="18" font-weight="700">2. Host</text>
  <text x="362" y="128" text-anchor="middle" fill="#4D6560" font-family="system-ui,sans-serif" font-size="13">slug.cinchseed.com</text>
  <path d="M462 108 H508" stroke="#3D9B7A" stroke-width="3" stroke-linecap="round"/>
  <path d="M496 98 L512 108 L496 118" fill="#3D9B7A"/>
  <rect x="512" y="48" width="176" height="120" rx="16" fill="#0F3D35"/>
  <text x="600" y="100" text-anchor="middle" fill="#F7FBF9" font-family="system-ui,sans-serif" font-size="18" font-weight="700">3. Point</text>
  <text x="600" y="128" text-anchor="middle" fill="#D5E9E0" font-family="system-ui,sans-serif" font-size="13">DNS → Cinch cell</text>
  <rect x="120" y="220" width="480" height="140" rx="20" fill="#FFFFFF" stroke="#1F6B5C" stroke-width="2"/>
  <text x="360" y="275" text-anchor="middle" fill="#0F3D35" font-family="system-ui,sans-serif" font-size="22" font-weight="700">Live on your domain</text>
  <text x="360" y="310" text-anchor="middle" fill="#4D6560" font-family="system-ui,sans-serif" font-size="15">Hosting fee covers the cell. Domains book through Cloudflare.</text>
</svg>
