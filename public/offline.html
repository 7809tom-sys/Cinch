<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b2e2a" />
    <title>Offline — Cinch Seed</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fffaf2;
        color: #0b2e2a;
        font-family: Figtree, system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .mark {
        font-weight: 800;
        letter-spacing: -0.03em;
        font-size: 2rem;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 12px;
      }
      p {
        color: #5a635e;
        line-height: 1.6;
        margin: 0;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        background: #0b2e2a;
        color: #fffaf2;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="mark">Cinch</p>
      <h1>You're offline</h1>
      <p>
        Cinch Seed can't reach the network right now. Reconnect to open your
        portal, drop a site, or keep growing your Seed.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
